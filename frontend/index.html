<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExportEase AI — AI Command Center for Global Exports</title>
    <meta name="description" content="ExportEase AI is an enterprise AI-powered export enablement platform for Indian MSMEs, manufacturers, and trade leaders." />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Prefetch for Google Translate -->
    <link rel="dns-prefetch" href="//translate.google.com" />
    <link rel="dns-prefetch" href="//translate.googleapis.com" />
    <link rel="preconnect" href="https://translate.google.com" />
    <link rel="preconnect" href="https://translate.googleapis.com" />
  </head>
  <body class="bg-[#04091a] text-[#f0f6ff] antialiased selection:bg-blue-500/30 selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Google Translate Injection -->
    <div id="google_translate_element" class="fixed bottom-4 right-4 z-50"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
