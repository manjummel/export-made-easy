# ExportEase AI Intelligence Engine — SYSTEM 1
# EXPORT-EASE-AI-ENGINE-V1

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "exportease-ai-engine"
version = "0.1.0"
description = "ExportEase AI Intelligence Engine — LLM + Multi-Agent System for Indian MSME Export Assistance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
keywords = ["export", "msme", "ai", "llm", "langgraph", "qdrant", "india"]

[tool.pytest.ini_options]
testpaths = ["ai_engine/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
